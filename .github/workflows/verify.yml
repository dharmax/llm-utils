name: Verify Ecosystem Libraries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: llm-utils
      - uses: actions/checkout@v4
        with:
          repository: dharmax/pubsub
          path: pubsub
      - uses: actions/checkout@v4
        with:
          repository: dharmax/shell-proc-utils
          path: shell-proc-utils
      - uses: actions/checkout@v4
        with:
          repository: dharmax/semantic-registry
          path: semantic-registry
      - uses: actions/checkout@v4
        with:
          repository: dharmax/block-patcher
          path: block-patcher
      - uses: actions/checkout@v4
        with:
          repository: dharmax/codebase-parser
          path: codebase-parser
      - uses: actions/checkout@v4
        with:
          repository: dharmax/shell-ui
          path: shell-ui
      - uses: actions/checkout@v4
        with:
          repository: dharmax/semantika
          path: semantika
      - uses: actions/checkout@v4
        with:
          repository: dharmax/context-manager
          path: context-manager
      - uses: actions/checkout@v4
        with:
          repository: dharmax/skill-manager
          path: skill-manager
      - uses: actions/checkout@v4
        with:
          repository: dharmax/text-compiler
          path: text-compiler

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspaces
        run: |
          set -euo pipefail
          for dir in pubsub shell-proc-utils semantic-registry block-patcher codebase-parser shell-ui semantika context-manager llm-utils skill-manager text-compiler; do
            echo "::group::install $dir"
            (cd "$dir" && bun install --no-save)
            echo "::endgroup::"
          done

      - name: Verify substrate libraries
        run: |
          set -euo pipefail
          (cd pubsub && bun run build && bun run test)
          (cd shell-proc-utils && bun run typecheck && bun run test && bun run build)
          (cd semantic-registry && bun run typecheck && bun run test)
          (cd block-patcher && bun run typecheck && bun run test)
          (cd codebase-parser && bun run test)
          (cd shell-ui && bun run typecheck && bun run test)

      - name: Verify semantic and context libraries
        run: |
          set -euo pipefail
          (cd semantika && bun run build && bun run test)
          (cd context-manager && bun run typecheck && bun run test && bun run build)
          (cd skill-manager && bun run typecheck && bun run test)

      - name: Verify LLM and compiler libraries
        run: |
          set -euo pipefail
          (cd llm-utils && bun run typecheck:all && bun run test && bun run build)
          (cd text-compiler && bun run build && bun run test)
